[package]
name = "yupp"
version = "0.1.1"
edition = "2021"
description = "0-LLM Rust CLI that catches AI test theater, silent slop, and PR blast radius in milliseconds"
license = "MIT"
readme = "README.md"
repository = "https://github.com/daffa2555/yupppp"
homepage = "https://github.com/daffa2555/yupppp"
keywords = ["cli", "git", "diff", "code-review", "tree-sitter"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["assets/**", ".github/**"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
walkdir = "2.5"
